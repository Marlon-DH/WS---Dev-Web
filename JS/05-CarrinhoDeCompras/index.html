<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho de Compras</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Yuyu&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="titulo">
            <h1>Carrinho de Compra</h1>
            <h2>itens de tecnologia</h2>
        </div>

        <button class="btn-header"><span>+</span> Novo Produto</button>

    </header>
    <main>
        <section class="card">
            <h2>Adicionar Produto</h2>
            <label for="produto">Produto</label>
            <select name="produto" id="produto">
                
            </select>
            <label for="quantidade">Quantidade</label>
            <input type="number" id="quantidade" min="1" value="1">
            
            <button class="btn-adicionar">Adicionar ao Carrinho</button>

            <div class="apresentacao">
                <div class="imagem" style="width: 150px;">
                    <img src="" alt="">
                </div>
                <div class="info-dados">
                    <h3>Mouse</h3>
                    <p>Mouse optico</p>
                    <p>R$ 49,90</p>
                </div>
            </div>
        </section>
        <section class="card">
            <h2>Produto no Carrinho</h2>
            <p>Seu carrinho está vazio</p>
            <hr>
            <div class="summary">
                <div class="summary-total">
                    <p>Total</p>
                    <p class="valor-total">R$ 0,00</p>
                </div>
                <button class="total-limpar">Limpar</button>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
