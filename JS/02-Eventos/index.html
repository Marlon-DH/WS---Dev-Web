<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos e Interações</title>
    <style>
    button{
        background-color: blueviolet;
        color: aliceblue;
        padding: 10px 18px;
        border-radius: 3px;
        border: none;
    }
    button:hover{
        background-color: blue;
    }
    </style>
</head>
<body>
    <h1>Eventos e Interações</h1>

    <p id="mensagem">Texto de HTML que será manipulado</p>

    <button onclick="mensagem()">Usando onclick</button>
    <button id="botaoEvento">Usando addEventListener</button>

    <script src="script.js"></script>
</body>
</html>
