<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Text</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Input Text</h1>
    <label for="nome">Nome: </label>
    <input type="text" id="nome" placeholder="Digite seu nome" value="Marlon" maxlength="15" minlength="3" required autofocus>
    <input type="text" id="sobrenome" placeholder="Digite seu sobrenome" title="Aqui você digita seu Sobrenome">
    <input type="text" id="sobrenome" placeholder="Digite seu sobrenome" disabled name="sobrenome" pattern="[A-Za-z]+">
</body>
</html>
