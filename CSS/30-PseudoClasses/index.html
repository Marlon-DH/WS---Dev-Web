<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Classes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Pseudo Classes</h1>
    <hr>
    <h2>:hover</h2>
    <button>Clique Aqui</button>
    <hr>
    <h2>:focus</h2>
    <input type="text" name="c" id="c" placeholder="Clique Aqui">
    <hr>
    <h2>:active</h2>
    <button>Clique e Segure</button>
    <hr>
    <h2>:visited</h2>
    <a href="#">Clique</a>
    <hr>
    <h2>:checked</h2>
    <label for="a">
        <input type="checkbox" name="a" id="a">
        Clique
    </label>
    <hr>
    <h2>:disabled</h2>
    <input type="text" name="v" id="v" disabled value=Desativado>
    <hr>
    <h2>:fist-child, :last-child, :nth-child(n)</h2>
    <ul>
        <li>Primeiro</li>
        <li>Segundo</li>
        <li>Terceiro</li>
        <li>Ultimo</li>
    </ul>
</body>
</html>
