<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="/">
    <label for="qtd">Quantidade de produtos: </label>
        <input type="number" name="qtd" id="qtd" placeholder="Digite a Quantidade de produtos"><br>
        <label for="telefone">Telefone par contato: </label>
        <input type="tel" name="telefone" id="telefone" placeholder="Digite seu telefone"><br>
        <label for="satisfacao">Sua satisfação: </label>
        <select name="satisfacao" id="satisfacao">
            <option value="" selected disabled>Selecione...</option>
            <option value="mb">Muito Bom</option>
            <option value="b">Bom</option>
            <option value="r">Ruim</option>
        </select><br>
    </form>
</body>
</html>
