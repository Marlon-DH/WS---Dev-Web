<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatações</title>
</head>
<body>
    Primeira Linha<br/>Segunda Linha
    <strong>Texto em negrito semantico</strong><br/>
    <b>Texto em negrito sem semantico</b><br/>

    <em>Texto em italico semantico</em><br/>
    <i>Texto em italico sem semantico</i><br/>

    <del>Texto tachado semantico</del><br/>
    <s>Texto tachado sem semantico</s><br/>

    <u>Texto sublinhado</u><br/>
    X<sup>2</sup><br/>
    H<sub>2</sub><br/>
    <code>Console.log("Hello, Word!");</code><br/>
    <blockquote>Citação em bloco</blockquote><br/>
    <q>Citação curta</q><br/>
</body>
</html>
